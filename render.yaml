services:
  - type: web
    name: insta-auto-dm
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: META_GRAPH_API_VERSION
        value: v21.0
      - key: META_GRAPH_API_BASE_URL
        value: https://graph.facebook.com
      - key: META_VERIFY_TOKEN
        value: insta_auto_dm_verify_token_2026
      - key: META_PAGE_ACCESS_TOKEN
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: INSTAGRAM_ACCOUNT_ID
        sync: false
      - key: AUTO_DM_TRIGGER_KEYWORD
        sync: false
      - key: AUTO_DM_RESPONSE_MESSAGE
        value: "Hey! Thanks for your comment. Here is your requested link: https://example.com"
